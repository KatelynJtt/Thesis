<!-- Modal for Target File Selection -->
<div class="modal fade" id="targetFileModal" tabindex="-1" role="dialog" aria-labelledby="targetFileModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="targetFileModalLabel">Select Target File</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="targetFileInput">Select Target File:</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="targetFileInput" readonly>
                        <div class="input-group-append">
                            <button class="btn btn-outline-secondary" type="button" id="targetFileUploadBtn">Upload</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="plotIdDropdown">Select Plot ID Column:</label>
                    <select class="form-control" id="plotIdDropdown"></select>
                </div>
                <div class="form-group">
                    <label for="targetColumnDropdown">Select Target Column:</label>
                    <select class="form-control" id="targetColumnDropdown"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="targetFileOkBtn">OK</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
